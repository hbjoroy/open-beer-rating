apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-tappd.fullname" . }}
  labels:
    {{- include "open-tappd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "open-tappd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "open-tappd.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "open-tappd.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.database.setup.enabled (not .Values.postgresql.enabled) }}
      initContainers:
        - name: db-setup
          image: postgres:17-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Checking if database '{{ .Values.database.name }}' exists..."
              if PGPASSWORD="$ADMIN_PASSWORD" psql -h "{{ include "open-tappd.databaseHost" . }}" -p {{ .Values.database.port }} -U "{{ .Values.database.setup.adminUser }}" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='{{ .Values.database.name }}'" | grep -q 1; then
                echo "Database already exists."
              else
                echo "Creating database and user..."
                PGPASSWORD="$ADMIN_PASSWORD" psql -h "{{ include "open-tappd.databaseHost" . }}" -p {{ .Values.database.port }} -U "{{ .Values.database.setup.adminUser }}" -d postgres <<SQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ .Values.database.user }}') THEN
                  CREATE ROLE "{{ .Values.database.user }}" WITH LOGIN PASSWORD '$(cat /run/secrets/db-password)';
                END IF;
              END\$\$;
              CREATE DATABASE "{{ .Values.database.name }}" OWNER "{{ .Values.database.user }}";
              GRANT ALL PRIVILEGES ON DATABASE "{{ .Values.database.name }}" TO "{{ .Values.database.user }}";
              SQL
                echo "Database and user created."
              fi
              echo "Ensuring user password is current..."
              PGPASSWORD="$ADMIN_PASSWORD" psql -h "{{ include "open-tappd.databaseHost" . }}" -p {{ .Values.database.port }} -U "{{ .Values.database.setup.adminUser }}" -d postgres -c "ALTER ROLE \"{{ .Values.database.user }}\" WITH PASSWORD '$(cat /run/secrets/db-password)'"
              echo "Database setup complete."
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-tappd.dbAdminSecretName" . }}
                  key: {{ include "open-tappd.dbAdminSecretKey" . }}
          volumeMounts:
            - name: db-password
              mountPath: /run/secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
              protocol: TCP
          env:
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: {{ .Values.app.port | quote }}
            - name: RUST_LOG
              value: {{ .Values.app.logLevel | quote }}
            - name: WEBAUTHN_RP_ID
              value: {{ .Values.app.webauthn.rpId | quote }}
            - name: WEBAUTHN_ORIGIN
              value: {{ .Values.app.webauthn.origin | quote }}
            - name: STATIC_DIR
              value: "/app/static"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-tappd.secretName" . }}
                  key: encryption-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-tappd.secretName" . }}
                  key: jwt-secret
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgresql.enabled }}
                  name: {{ .Release.Name }}-postgresql
                  key: password
                  {{- else }}
                  name: {{ include "open-tappd.dbPasswordSecretName" . }}
                  key: {{ include "open-tappd.dbPasswordSecretKey" . }}
                  {{- end }}
            - name: DATABASE_URL
              value: {{ include "open-tappd.databaseUrl" . | quote }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.database.setup.enabled (not .Values.postgresql.enabled) }}
        - name: db-password
          secret:
            secretName: {{ include "open-tappd.dbPasswordSecretName" . }}
            items:
              - key: {{ include "open-tappd.dbPasswordSecretKey" . }}
                path: db-password
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
