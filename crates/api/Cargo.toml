[package]
name = "open-tappd-api"
default-run = "open-tappd-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
external-heic-fixture-tests = []
external-untappd-fixture-tests = []

[dependencies]
open-tappd-domain = { workspace = true, features = ["sqlx-support"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = "0.8"
axum-extra = { version = "0.10", features = ["typed-header"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "json"] }
dotenvy = "0.15"
argon2 = "0.5"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
open-tappd-webauthn = { path = "../webauthn" }
url = "2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# Exact pin: upload preflight guards are reviewed against this decoder's internals.
heic-rs = { version = "=0.1.4", default-features = false, features = ["std"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
